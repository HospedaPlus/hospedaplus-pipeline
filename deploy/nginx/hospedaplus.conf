# Nginx on the núcleo EC2: https://airflow|flower|rabbitmq.coderhivex.com -> local containers.
# Install:  sudo cp deploy/nginx/hospedaplus.conf /etc/nginx/sites-available/hospedaplus
#           sudo ln -sf /etc/nginx/sites-available/hospedaplus /etc/nginx/sites-enabled/
#           sudo rm -f /etc/nginx/sites-enabled/default && sudo nginx -t && sudo systemctl reload nginx
# Certificate: Cloudflare Origin Certificate for *.coderhivex.com (DNS proxied, SSL/TLS "Full (strict)").

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name airflow.coderhivex.com flower.coderhivex.com rabbitmq.coderhivex.com;
    return 301 https://$host$request_uri;
}

# Shared TLS settings for the three hosts.
ssl_certificate     /etc/ssl/coderhivex/origin.pem;
ssl_certificate_key /etc/ssl/coderhivex/origin.key;
ssl_protocols       TLSv1.2 TLSv1.3;

# Airflow: no auth_basic. Airflow has its own login and REST clients send "Authorization: Bearer",
# which auth_basic would reject.
server {
    listen 443 ssl http2;
    server_name airflow.coderhivex.com;
    client_max_body_size 20m;

    # Workers reach the execution API on :8080 over the private network; never through here.
    location /execution/ { return 403; }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }
}

# Flower has no login of its own, so Nginx asks for one (/etc/nginx/.htpasswd).
server {
    listen 443 ssl http2;
    server_name flower.coderhivex.com;

    auth_basic "HospedaPlus";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:5555;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# RabbitMQ management: its own login uses the Authorization header, so no auth_basic.
# proxy_pass has no URI part on purpose: Nginx then forwards %2F (default vhost) untouched.
server {
    listen 443 ssl http2;
    server_name rabbitmq.coderhivex.com;

    location / {
        proxy_pass http://127.0.0.1:15672;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
    }
}
